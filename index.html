<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cost Center Code Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>html, body { height: 100%; } body { background: #0a0a0a; }</style>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
</head>
<body class="text-zinc-100">
  <div id="root"></div>

<script type="text/babel">
const { useEffect, useMemo, useState, useCallback, useRef } = React;

// ─── GitHub Config (edit these after uploading to GitHub) ────────────────────
// Users fill these in via the GitHub Settings panel in the Admin tab.
// They are stored in localStorage so they don't need to re-enter them.
const GH_CONFIG_KEY = "cccm_gh_config_v1";
const LS_STORE_KEY  = "cccm_datastore_v2";

function loadGhConfig() {
  try { const s = localStorage.getItem(GH_CONFIG_KEY); if (s) return JSON.parse(s); } catch {}
  return { owner: "", repo: "", branch: "main", path: "data.json", token: "" };
}
function saveGhConfig(cfg) { localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(cfg)); }

// ─── Local data cache ────────────────────────────────────────────────────────
function loadLocalStore() {
  try { const s = localStorage.getItem(LS_STORE_KEY); if (s) return JSON.parse(s); } catch {}
  return null;
}
function saveLocalStore(ds) { localStorage.setItem(LS_STORE_KEY, JSON.stringify(ds)); }

// ─── GitHub API helpers ──────────────────────────────────────────────────────
async function ghFetch(cfg, method, body) {
  const { owner, repo, branch, path, token } = cfg;
  const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
  const headers = {
    "Authorization": `Bearer ${token}`,
    "Accept": "application/vnd.github+json",
    "Content-Type": "application/json",
  };
  const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `GitHub API error ${res.status}`);
  }
  return res.json();
}

async function fetchFromGitHub(cfg) {
  const data = await ghFetch(cfg, "GET");
  const json = JSON.parse(atob(data.content.replace(/\n/g, "")));
  return { store: json, sha: data.sha };
}

async function saveToGitHub(cfg, store, sha) {
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(store, null, 2))));
  const body = {
    message: `Update data.json — ${new Date().toISOString()}`,
    content,
    branch: cfg.branch,
    ...(sha ? { sha } : {}),
  };
  return ghFetch(cfg, "PUT", body);
}

// ─── Constants ───────────────────────────────────────────────────────────────
const levelsOrder = ["L1","L2","L3","L4","L5"];
const levelLabels = { L1:"Level 1", L2:"Level 2", L3:"Level 3", L4:"Level 4", L5:"Level 5" };

function normalizeText(s="") { return s.toLowerCase().trim(); }
function matchesParents(item, selection) {
  if (!item.parent) return true;
  return Object.entries(item.parent).every(([k,v]) => !v || selection[k]===v);
}
function ruleMatches(rule, selection) {
  const { when = {} } = rule;
  return Object.entries(when).every(([lvl, list]) => !list?.length || list.includes(selection[lvl]||""));
}
function applyRules(rules, selection) {
  const active = (rules||[]).filter(r => r.enabled && ruleMatches(r, selection))
                    .sort((a,b)=> (b.priority||0)-(a.priority||0));
  const effects = { disable: new Set(), hide: new Set(), restrictOptions: { L2:null,L3:null,L4:null,L5:null }, notes: [] };
  for (const r of active) {
    r.effect?.disable?.forEach(l => effects.disable.add(l));
    r.effect?.hide?.forEach(l => effects.hide.add(l));
    if (r.effect?.restrictOptions) for (const [lvl, list] of Object.entries(r.effect.restrictOptions)) effects.restrictOptions[lvl] = list;
    if (r.effect?.note) effects.notes.push(r.effect.note);
  }
  return { active, effects };
}

// ─── UI Helpers ──────────────────────────────────────────────────────────────
const Section = ({ title, children, right }) => (
  <div className="rounded-2xl shadow p-4 md:p-6 bg-white/5 border border-white/10">
    <div className="flex items-center justify-between gap-3 mb-3">
      <h2 className="text-lg font-semibold">{title}</h2>
      {right}
    </div>
    {children}
  </div>
);
const Pill = ({children, color="default"}) => {
  const colors = { default: "border-white/20 text-white/80", green: "border-green-500/40 text-green-300 bg-green-900/20", red: "border-red-500/40 text-red-300 bg-red-900/20", blue: "border-blue-500/40 text-blue-300 bg-blue-900/20" };
  return <span className={`inline-flex items-center px-2 py-0.5 text-xs rounded-full border ${colors[color]}`}>{children}</span>;
};
const Btn = ({ children, onClick, variant="default", size="sm", disabled=false, className="" }) => {
  const base = "inline-flex items-center justify-center rounded-xl font-medium transition-all disabled:opacity-40 disabled:cursor-not-allowed";
  const sizes = { sm: "px-3 py-1.5 text-sm", md: "px-4 py-2 text-sm", xs: "px-2 py-1 text-xs" };
  const variants = {
    default: "border border-white/20 hover:bg-white/10",
    primary: "bg-indigo-600 hover:bg-indigo-500 text-white",
    danger: "bg-red-600/80 hover:bg-red-500 text-white border border-red-500/30",
    ghost: "hover:bg-white/10",
    success: "bg-green-700 hover:bg-green-600 text-white",
  };
  return <button onClick={onClick} disabled={disabled} className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}>{children}</button>;
};

function SearchSelect({ label, disabled, value, onChange, options }) {
  const [query, setQuery] = useState("");
  const filtered = useMemo(() => {
    const q = normalizeText(query);
    if (!q) return options;
    return options.filter(o => normalizeText(o.code+" "+o.name).includes(q));
  }, [query, options]);
  return (
    <div className="space-y-1">
      <label className="text-sm text-white/70">{label}</label>
      <input disabled={disabled}
        className={`w-full rounded-xl border px-3 py-2 text-sm bg-black/30 border-white/15 outline-none focus:ring focus:ring-indigo-500/30 ${disabled?"opacity-60 cursor-not-allowed":""}`}
        placeholder={disabled?"Disabled by rules":"Type to filter..."}
        value={query} onChange={e=>setQuery(e.target.value)} />
      <div className={`max-h-44 overflow-auto rounded-xl border bg-black/30 border-white/15 ${disabled?"opacity-60 pointer-events-none":""}`}>
        {filtered.length===0 && <div className="p-2 text-sm text-white/60">No options</div>}
        {filtered.map(o => (
          <button key={o.code+o.name}
            className={`w-full text-left px-3 py-2 text-sm hover:bg-white/10 ${value===o.code?"bg-indigo-500/20":""}`}
            onClick={()=>onChange(o.code)}>
            <div className="font-medium">{o.code}</div>
            <div className="text-xs text-white/70">{o.name}</div>
          </button>
        ))}
      </div>
    </div>
  );
}

// ─── Password Gate ────────────────────────────────────────────────────────────
function PasswordGate({ onSuccess }) {
  const [input, setInput] = useState("");
  const [error, setError] = useState("");
  const check = () => {
    if (input === "05012023") onSuccess();
    else setError("Incorrect admin password.");
  };
  return (
    <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50">
      <div className="bg-zinc-900 p-6 rounded-2xl shadow-lg max-w-sm w-full border border-white/10 space-y-3">
        <h2 className="text-lg font-semibold">Admin Login</h2>
        <input type="password" className="w-full rounded-xl border px-3 py-2 text-sm bg-black/30 border-white/15 outline-none"
               placeholder="Enter Admin Password" value={input}
               onChange={e=>setInput(e.target.value)}
               onKeyDown={e=>e.key==="Enter"&&check()} />
        {error && <div className="text-red-400 text-sm">{error}</div>}
        <Btn variant="primary" size="md" onClick={check} className="w-full">Login</Btn>
      </div>
    </div>
  );
}

// ─── GitHub Settings Panel ───────────────────────────────────────────────────
function GitHubSettings({ cfg, onChange }) {
  const [local, setLocal] = useState(cfg);
  const set = (k,v) => setLocal(p=>({...p,[k]:v}));
  const save = () => { onChange(local); alert("GitHub settings saved!"); };
  return (
    <Section title="GitHub Settings" right={<Pill color="blue">Database Config</Pill>}>
      <p className="text-sm text-white/60 mb-4">These settings connect the app to your GitHub repo where <code className="bg-white/10 px-1 rounded">data.json</code> is stored. Changes you make in the Admin panel will be saved directly to GitHub.</p>
      <div className="grid md:grid-cols-2 gap-3">
        {[
          { key:"owner", label:"GitHub Username / Org", placeholder:"e.g. myusername" },
          { key:"repo",  label:"Repository Name",       placeholder:"e.g. cost-center-codes" },
          { key:"branch",label:"Branch",                placeholder:"main" },
          { key:"path",  label:"File path in repo",     placeholder:"data.json" },
        ].map(({key,label,placeholder}) => (
          <div key={key} className="space-y-1">
            <label className="text-sm text-white/70">{label}</label>
            <input className="w-full rounded-xl border px-3 py-2 text-sm bg-black/30 border-white/15 outline-none focus:ring focus:ring-indigo-500/30"
                   placeholder={placeholder} value={local[key]} onChange={e=>set(key,e.target.value)} />
          </div>
        ))}
        <div className="md:col-span-2 space-y-1">
          <label className="text-sm text-white/70">Personal Access Token <span className="text-white/40">(needs <code>contents: write</code> permission)</span></label>
          <input type="password" className="w-full rounded-xl border px-3 py-2 text-sm bg-black/30 border-white/15 outline-none focus:ring focus:ring-indigo-500/30"
                 placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" value={local.token} onChange={e=>set("token",e.target.value)} />
          <p className="text-xs text-white/40">Create at: GitHub → Settings → Developer Settings → Personal Access Tokens → Fine-grained → repository "Contents" read+write.</p>
        </div>
      </div>
      <div className="mt-3">
        <Btn variant="primary" onClick={save}>Save Settings</Btn>
      </div>
    </Section>
  );
}

// ─── Item Editor (Add / Edit modal) ──────────────────────────────────────────
function ItemModal({ level, item, store, onSave, onClose }) {
  const isEdit = !!item;
  const parentLvl = { L2:"L1", L3:null, L4:"L3", L5:"L4" }[level];
  const [code, setCode] = useState(item?.code||"");
  const [name, setName] = useState(item?.name||"");
  const [parent, setParent] = useState(item?.parent || (parentLvl ? {[parentLvl]:""} : undefined));
  const [err, setErr] = useState("");

  const parentOptions = parentLvl ? (store.levels[parentLvl]||[]) : [];

  const submit = () => {
    if (!code.trim()) { setErr("Code is required."); return; }
    if (!name.trim()) { setErr("Name is required."); return; }
    if (parentLvl && !parent?.[parentLvl]) { setErr(`Please select a ${parentLvl} parent.`); return; }
    // duplicate code check (only for new items)
    if (!isEdit) {
      const exists = (store.levels[level]||[]).find(x => x.code === code.trim() && JSON.stringify(x.parent) === JSON.stringify(parent));
      if (exists) { setErr(`Code "${code}" already exists in ${level} under same parent.`); return; }
    }
    const entry = { code: code.trim(), name: name.trim() };
    if (parentLvl) entry.parent = parent;
    onSave(entry);
  };

  return (
    <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
      <div className="bg-zinc-900 rounded-2xl border border-white/10 shadow-2xl w-full max-w-md space-y-4 p-6">
        <div className="flex items-center justify-between">
          <h3 className="font-semibold text-lg">{isEdit ? "Edit" : "Add"} {levelLabels[level]} Item</h3>
          <Btn variant="ghost" size="xs" onClick={onClose}>✕</Btn>
        </div>
        {parentLvl && (
          <div className="space-y-1">
            <label className="text-sm text-white/70">Parent {parentLvl}</label>
            <select className="w-full rounded-xl border px-3 py-2 text-sm bg-black/30 border-white/15 outline-none"
                    value={parent?.[parentLvl]||""}
                    onChange={e=>setParent({[parentLvl]:e.target.value})}>
              <option value="">— Select {parentLvl} —</option>
              {parentOptions.map(o=>(
                <option key={o.code+o.name} value={o.code}>{o.code} — {o.name}</option>
              ))}
            </select>
          </div>
        )}
        <div className="space-y-1">
          <label className="text-sm text-white/70">Code</label>
          <input className="w-full rounded-xl border px-3 py-2 text-sm bg-black/30 border-white/15 outline-none focus:ring focus:ring-indigo-500/30"
                 placeholder="e.g. 2099" value={code} onChange={e=>setCode(e.target.value)} />
        </div>
        <div className="space-y-1">
          <label className="text-sm text-white/70">Name</label>
          <textarea className="w-full rounded-xl border px-3 py-2 text-sm bg-black/30 border-white/15 outline-none focus:ring focus:ring-indigo-500/30 resize-none"
                 rows={3} placeholder="Description..." value={name} onChange={e=>setName(e.target.value)} />
        </div>
        {err && <div className="text-red-400 text-sm">{err}</div>}
        <div className="flex gap-2 pt-1">
          <Btn variant="primary" onClick={submit} className="flex-1">{isEdit ? "Save Changes" : "Add Item"}</Btn>
          <Btn variant="default" onClick={onClose}>Cancel</Btn>
        </div>
      </div>
    </div>
  );
}

// ─── Level Editor Panel ───────────────────────────────────────────────────────
function LevelEditor({ level, store, onStoreChange }) {
  const [modal, setModal] = useState(null); // null | { item } | "add"
  const [search, setSearch] = useState("");
  const [filterParent, setFilterParent] = useState("");

  const parentLvl = { L2:"L1", L3:null, L4:"L3", L5:"L4" }[level];
  const items = store.levels[level] || [];
  const parentOptions = parentLvl ? (store.levels[parentLvl]||[]) : [];

  const filtered = useMemo(() => {
    let arr = items;
    if (filterParent) arr = arr.filter(i => i.parent?.[parentLvl] === filterParent);
    if (search) {
      const q = normalizeText(search);
      arr = arr.filter(i => normalizeText(i.code+" "+i.name).includes(q));
    }
    return arr;
  }, [items, search, filterParent, parentLvl]);

  const saveItem = (entry) => {
    const newLevels = { ...store.levels };
    const arr = [...(newLevels[level]||[])];
    if (modal?.item) {
      // edit: find by original code+parent
      const idx = arr.findIndex(x => x.code===modal.item.code && JSON.stringify(x.parent)===JSON.stringify(modal.item.parent));
      if (idx >= 0) arr[idx] = entry; else arr.push(entry);
    } else {
      arr.push(entry);
    }
    newLevels[level] = arr;
    onStoreChange({ ...store, levels: newLevels });
    setModal(null);
  };

  const deleteItem = (item) => {
    if (!confirm(`Delete "${item.code} — ${item.name}"?\n\nNote: child items referencing this will NOT be automatically deleted.`)) return;
    const newLevels = { ...store.levels };
    newLevels[level] = (newLevels[level]||[]).filter(x => !(x.code===item.code && JSON.stringify(x.parent)===JSON.stringify(item.parent)));
    onStoreChange({ ...store, levels: newLevels });
  };

  return (
    <div className="rounded-2xl border border-white/10 bg-white/3 p-4 space-y-3">
      <div className="flex items-center justify-between gap-2 flex-wrap">
        <div className="font-semibold text-white/90">{levelLabels[level]} <span className="text-white/40 text-sm">({filtered.length}/{items.length})</span></div>
        <Btn variant="primary" size="xs" onClick={()=>setModal("add")}>+ Add</Btn>
      </div>

      <div className="flex gap-2 flex-wrap">
        <input className="flex-1 min-w-0 rounded-xl border px-3 py-1.5 text-sm bg-black/30 border-white/15 outline-none"
               placeholder="Search code or name..." value={search} onChange={e=>setSearch(e.target.value)} />
        {parentLvl && (
          <select className="rounded-xl border px-2 py-1.5 text-sm bg-black/30 border-white/15 outline-none"
                  value={filterParent} onChange={e=>setFilterParent(e.target.value)}>
            <option value="">All {parentLvl}</option>
            {parentOptions.map(o=>(
              <option key={o.code} value={o.code}>{o.code}</option>
            ))}
          </select>
        )}
      </div>

      <div className="max-h-80 overflow-auto divide-y divide-white/5 rounded-xl border border-white/10">
        {filtered.length===0 && <div className="p-3 text-sm text-white/40 text-center">No items found.</div>}
        {filtered.map((item,i) => (
          <div key={item.code+i} className="flex items-start gap-2 px-3 py-2 hover:bg-white/5 group">
            <div className="flex-1 min-w-0">
              <div className="font-mono text-sm font-medium">{item.code}</div>
              <div className="text-xs text-white/60 truncate">{item.name}</div>
              {item.parent && (
                <div className="text-xs text-indigo-400/70 mt-0.5">
                  {Object.entries(item.parent).map(([k,v])=>`${k}: ${v}`).join(", ")}
                </div>
              )}
            </div>
            <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0">
              <Btn size="xs" variant="default" onClick={()=>setModal({item})}>✎</Btn>
              <Btn size="xs" variant="danger" onClick={()=>deleteItem(item)}>✕</Btn>
            </div>
          </div>
        ))}
      </div>

      {(modal==="add" || modal?.item) && (
        <ItemModal
          level={level}
          item={modal?.item}
          store={store}
          onSave={saveItem}
          onClose={()=>setModal(null)}
        />
      )}
    </div>
  );
}

// ─── Validator ────────────────────────────────────────────────────────────────
function Validator({ onValidate }) {
  const [input, setInput] = useState("");
  const [res, setRes] = useState(null);
  return (
    <div className="space-y-3">
      <div className="flex gap-2">
        <input className="flex-1 rounded-xl border px-3 py-2 text-sm bg-black/30 border-white/15 outline-none"
               placeholder="Paste code like 101-2100-30-401-5001 (use XX for empty levels)"
               value={input} onChange={e=>setInput(e.target.value)} />
        <Btn variant="default" onClick={()=>setRes(onValidate(input))}>Validate</Btn>
      </div>
      {res && (
        <div className="space-y-2">
          {res.details && res.details.map((d) => (
            <div key={d.level} className={`rounded-xl p-3 border ${d.valid ? 'bg-green-900/30 text-green-200 border-green-700/40' : 'bg-red-900/30 text-red-200 border-red-700/40'}`}>
              <div className="font-semibold">Level {levelsOrder.indexOf(d.level)+1}: {d.code}</div>
              {d.name && <div className="text-sm opacity-90">{d.name}</div>}
              {!d.valid && d.message && <div className="text-sm mt-1">{d.message}</div>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── Main App ─────────────────────────────────────────────────────────────────
function App() {
  const [store, setStore] = useState(null);
  const [sha, setSha] = useState(null);
  const [ghCfg, setGhCfg] = useState(loadGhConfig);
  const [tab, setTab] = useState("builder");
  const [unlocked, setUnlocked] = useState(false);
  const [status, setStatus] = useState({ type:"", msg:"" });
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [dirty, setDirty] = useState(false);
  const [sel, setSel] = useState({ L1:"", L2:"", L3:"", L4:"", L5:"" });

  const isGhConfigured = ghCfg.owner && ghCfg.repo && ghCfg.token;

  // Load data on mount
  useEffect(() => {
    async function load() {
      setLoading(true);
      if (isGhConfigured) {
        try {
          const { store: s, sha: sh } = await fetchFromGitHub(ghCfg);
          setStore(s);
          setSha(sh);
          saveLocalStore(s);
          setStatus({ type:"success", msg:"Loaded from GitHub ✓" });
        } catch(e) {
          const cached = loadLocalStore();
          if (cached) {
            setStore(cached);
            setStatus({ type:"warn", msg:`Using cached data (GitHub error: ${e.message})` });
          } else {
            setStatus({ type:"error", msg:`GitHub error: ${e.message}. Configure GitHub settings in Admin tab.` });
            setStore({ version:1, publishedAt: new Date().toISOString(), levels:{L1:[],L2:[],L3:[],L4:[],L5:[]}, rules:[] });
          }
        }
      } else {
        const cached = loadLocalStore();
        if (cached) {
          setStore(cached);
          setStatus({ type:"warn", msg:"Offline mode — configure GitHub in Admin tab to save changes." });
        } else {
          try {
            const res = await fetch("./data.json");
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const j = await res.json();
            setStore(j);
            saveLocalStore(j);
            setStatus({ type:"warn", msg:"Loaded bundled data.json — configure GitHub in Admin tab to save changes." });
          } catch(e) {
            setStore({ version:1, publishedAt: new Date().toISOString(), levels:{L1:[],L2:[],L3:[],L4:[],L5:[]}, rules:[] });
            setStatus({ type:"warn", msg:"No data — configure GitHub settings in Admin tab." });
          }
        }
      }
      setLoading(false);
    }
    load();
  }, []);

  const updateStore = useCallback((newStore) => {
    setStore(newStore);
    saveLocalStore(newStore);
    setDirty(true);
  }, []);

  const publishToGitHub = async () => {
    if (!isGhConfigured) { alert("Configure GitHub settings first."); return; }
    setSaving(true);
    try {
      const updated = { ...store, publishedAt: new Date().toISOString() };
      const result = await saveToGitHub(ghCfg, updated, sha);
      setSha(result.content.sha);
      setStore(updated);
      saveLocalStore(updated);
      setDirty(false);
      setStatus({ type:"success", msg:`Saved to GitHub ✓ (${new Date().toLocaleTimeString()})` });
    } catch(e) {
      setStatus({ type:"error", msg:`Save failed: ${e.message}` });
      alert("Save to GitHub failed: " + e.message);
    }
    setSaving(false);
  };

  const refreshFromGitHub = async () => {
    if (!isGhConfigured) { alert("Configure GitHub settings first."); return; }
    setLoading(true);
    try {
      const { store: s, sha: sh } = await fetchFromGitHub(ghCfg);
      setStore(s);
      setSha(sh);
      saveLocalStore(s);
      setDirty(false);
      setStatus({ type:"success", msg:"Refreshed from GitHub ✓" });
    } catch(e) {
      setStatus({ type:"error", msg:`Refresh failed: ${e.message}` });
    }
    setLoading(false);
  };

  // Builder logic
  const { active: activeRules, effects } = useMemo(()=> store ? applyRules(store.rules||[], sel) : { active:[], effects:{ disable:new Set(), hide:new Set(), restrictOptions:{}, notes:[] } }, [store?.rules, sel]);

  const options = useMemo(() => {
    if (!store) return {};
    const out = {};
    for (const lvl of levelsOrder) {
      let arr = store.levels[lvl] || [];
      arr = arr.filter(it => matchesParents(it, sel));
      const restrict = effects.restrictOptions?.[lvl];
      if (restrict?.length) arr = arr.filter(it => restrict.includes(it.code));
      if (lvl==='L3' && sel.L1==='121') {
        if (!arr.some(a=>a.code==='40')) arr = [...arr, { code:'40', name:'Utilities', parent:{L1:'121'} }];
      }
      out[lvl] = arr;
    }
    return out;
  }, [store, sel, effects]);

  const disabled = useMemo(()=>({ L2: effects.disable.has("L2"), L3: effects.disable.has("L3"), L4: effects.disable.has("L4"), L5: effects.disable.has("L5") }), [effects]);

  const updateLevel = (lvl, codeVal) => {
    setSel(prev => {
      const idx = levelsOrder.indexOf(lvl);
      const next = { ...prev, [lvl]: codeVal };
      for (let i=idx+1; i<levelsOrder.length; i++) next[levelsOrder[i]] = "";
      return next;
    });
  };

  const code = levelsOrder.map(l => sel[l]||"xx").join("-");
  const copyToClipboard = async (text) => { try { await navigator.clipboard.writeText(text); alert("Copied!"); } catch {} };

  const validateCode = (codeStr) => {
    if (!store) return { ok:false, details:[] };
    const depOf = { L2:"L1", L3:"L1", L4:"L3", L5:"L4" };
    const parts = (codeStr||"").trim().split(/[-\s]+/);
    const out = { ok:false, details:[], input:codeStr };
    if (parts.length !== 5) {
      out.details = levelsOrder.map((lvl,i) => ({ level:lvl, code:(parts[i]||'').toUpperCase(), name:"", valid:false, message:"Code must have 5 parts (L1-L5)." }));
      return out;
    }
    const norm = p => (/^x{2}$/i.test(p) ? "" : p);
    const [L1,L2,L3,L4,L5] = parts.map(norm);
    const s = { L1,L2,L3,L4,L5 };
    const { effects } = applyRules(store.rules||[], s);
    const det = [];
    for (const lvl of levelsOrder) {
      const provided = s[lvl]||"";
      const dis = effects.disable.has(lvl);
      let opts = (store.levels[lvl]||[]).filter(it => matchesParents(it, s));
      const restrict = effects.restrictOptions?.[lvl];
      if (restrict?.length) opts = opts.filter(it => restrict.includes(it.code));
      const found = (store.levels[lvl]||[]).find(x => x.code===provided);
      const name = found?.name||"";
      let valid=false, message="";
      if (dis) { valid = provided===""; if (!valid) message=`${lvl} is disabled by rules.`; }
      else if (opts.length===0) { valid = provided===""; if (!valid) message=`No ${lvl} expected for parents.`; }
      else {
        if (!provided) { valid=false; message=`Required ${lvl} is missing.`; }
        else { valid = !!opts.find(o=>o.code===provided); if (!valid) { const dep=depOf[lvl]; message = dep?`Not valid for ${dep} ${s[dep]||"—"}`:`Invalid ${lvl}.`; } }
      }
      det.push({ level:lvl, code:(provided||"xx").toUpperCase(), name, valid, message });
    }
    out.details = det;
    out.ok = det.every(d=>d.valid);
    return out;
  };

  if (loading) return (
    <div className="min-h-screen bg-gradient-to-b from-zinc-950 to-black flex items-center justify-center">
      <div className="text-white/60 text-lg animate-pulse">Loading data…</div>
    </div>
  );

  const statusColors = { success:"bg-green-900/30 border-green-700/40 text-green-300", warn:"bg-yellow-900/30 border-yellow-700/40 text-yellow-300", error:"bg-red-900/30 border-red-700/40 text-red-300" };

  return (
    <div className="min-h-screen bg-gradient-to-b from-zinc-950 to-black p-4 md:p-8">
      <div className="max-w-7xl mx-auto space-y-5">

        {/* Header */}
        <header className="flex flex-wrap items-center justify-between gap-3">
          <h1 className="text-2xl md:text-3xl font-bold">Cost Center Code Manager</h1>
          <div className="flex items-center gap-2 flex-wrap">
            {dirty && <Pill color="red">Unsaved changes</Pill>}
            {isGhConfigured && <Pill color="blue">GitHub: {ghCfg.owner}/{ghCfg.repo}</Pill>}
            <Btn variant={tab==="builder"?"primary":"default"} onClick={()=>setTab("builder")}>Builder</Btn>
            <Btn variant={tab==="admin"?"primary":"default"} onClick={()=>setTab("admin")}>Admin</Btn>
          </div>
        </header>

        {/* Status bar */}
        {status.msg && (
          <div className={`rounded-xl border px-4 py-2 text-sm flex items-center justify-between gap-2 ${statusColors[status.type]||statusColors.warn}`}>
            <span>{status.msg}</span>
            <button onClick={()=>setStatus({type:"",msg:""})} className="opacity-60 hover:opacity-100 text-xs">✕</button>
          </div>
        )}

        {/* Builder tab */}
        {tab==="builder" && (
          <div className="space-y-4">
            <div className="grid md:grid-cols-5 gap-4">
              {levelsOrder.map(lvl => (
                <Section key={lvl} title={`${levelLabels[lvl]} (${lvl})`} right={disabled[lvl] && <Pill>Disabled</Pill>}>
                  <SearchSelect label={`Pick ${lvl}`} disabled={!!disabled[lvl]} value={sel[lvl]}
                                onChange={(v)=>updateLevel(lvl,v)} options={options[lvl]||[]} />
                </Section>
              ))}
            </div>
            <div className="md:col-span-5 space-y-4">
              <Section title="Live Code">
                <div className="flex flex-wrap items-center gap-3">
                  <div className="text-2xl font-mono tracking-widest">{code}</div>
                  <Btn variant="primary" onClick={()=>copyToClipboard(code)}>Copy code</Btn>
                  <Btn variant="default" onClick={()=>setSel({L1:"",L2:"",L3:"",L4:"",L5:""})}>Reset</Btn>
                </div>
                {activeRules.length>0 && (
                  <div className="mt-3 flex flex-wrap gap-2">
                    {activeRules.map(r=><Pill key={r.id}>Rule: {r.id}</Pill>)}
                  </div>
                )}
                {effects.notes?.length>0 && (
                  <ul className="mt-2 list-disc list-inside text-sm text-white/70">
                    {effects.notes.map((n,i)=><li key={i}>{n}</li>)}
                  </ul>
                )}
              </Section>
              <Section title="Validate Code">
                <Validator onValidate={validateCode} />
              </Section>
            </div>
          </div>
        )}

        {/* Admin tab */}
        {tab==="admin" && (
          unlocked ? (
            <div className="space-y-6">
              {/* Save bar */}
              <Section title="Sync with GitHub" right={dirty ? <Pill color="red">Unsaved</Pill> : <Pill color="green">Up to date</Pill>}>
                <div className="flex flex-wrap gap-2 items-center">
                  <Btn variant="success" onClick={publishToGitHub} disabled={saving||!dirty}>
                    {saving ? "Saving…" : "💾 Save to GitHub"}
                  </Btn>
                  <Btn variant="default" onClick={refreshFromGitHub} disabled={saving}>↻ Refresh from GitHub</Btn>
                  <Btn variant="default" onClick={()=>{
                    const a=document.createElement('a');
                    a.href=URL.createObjectURL(new Blob([JSON.stringify(store,null,2)],{type:"application/json"}));
                    a.download=`cccm_data_${new Date().toISOString().slice(0,10)}.json`;
                    a.click();
                  }}>⬇ Export JSON</Btn>
                  <label className="inline-flex items-center cursor-pointer px-3 py-1.5 text-sm rounded-xl border border-white/20 hover:bg-white/10">
                    ⬆ Import JSON
                    <input type="file" className="hidden" accept="application/json" onChange={e=>{
                      const f=e.target.files?.[0]; if(!f) return;
                      const r=new FileReader();
                      r.onload=()=>{
                        try {
                          const j=JSON.parse(r.result);
                          if(!j.levels||!j.levels.L1) throw new Error("Invalid schema");
                          updateStore(j);
                          alert("Imported. Click 'Save to GitHub' to publish.");
                        } catch(err) { alert("Import failed: "+err.message); }
                      };
                      r.readAsText(f);
                    }} />
                  </label>
                </div>
                {!isGhConfigured && (
                  <p className="text-sm text-yellow-400 mt-2">⚠ GitHub not configured — scroll down to configure it.</p>
                )}
              </Section>

              {/* Level editors */}
              <Section title="Edit Levels">
                <div className="space-y-4">
                  {levelsOrder.map(lvl => (
                    <LevelEditor key={lvl} level={lvl} store={store} onStoreChange={updateStore} />
                  ))}
                </div>
              </Section>

              {/* GitHub settings */}
              <GitHubSettings cfg={ghCfg} onChange={cfg=>{ setGhCfg(cfg); saveGhConfig(cfg); }} />
            </div>
          ) : (
            <PasswordGate onSuccess={()=>setUnlocked(true)} />
          )
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
