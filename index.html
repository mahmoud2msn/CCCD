<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cost Center Code Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html,body{height:100%;}
    body{background:#0a0a0a;}
    .scrollbar-thin::-webkit-scrollbar{width:4px;height:4px;}
    .scrollbar-thin::-webkit-scrollbar-track{background:transparent;}
    .scrollbar-thin::-webkit-scrollbar-thumb{background:#444;border-radius:4px;}
  </style>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.2/babel.min.js"></script>
</head>
<body class="text-zinc-100">
  <div id="root"></div>
<script type="text/babel" data-presets="react,env">

var useState    = React.useState;
var useEffect   = React.useEffect;
var useMemo     = React.useMemo;

/* ════════════════════════════════════════
   STORAGE
═════════════════════════════════════════ */
var GH_KEY    = "cccm_gh_v1";
var STORE_KEY = "cccm_store_v3";

function loadGhCfg(){
  try{ var s=localStorage.getItem(GH_KEY); if(s) return JSON.parse(s); }catch(e){}
  return {owner:"",repo:"",branch:"main",path:"data.json",token:""};
}
function saveGhCfg(c){ localStorage.setItem(GH_KEY,JSON.stringify(c)); }
function loadCache(){
  try{ var s=localStorage.getItem(STORE_KEY); if(s) return JSON.parse(s); }catch(e){}
  return null;
}
function saveCache(ds){ localStorage.setItem(STORE_KEY,JSON.stringify(ds)); }

/* ════════════════════════════════════════
   GITHUB API
═════════════════════════════════════════ */
async function ghGet(cfg){
  var url="https://api.github.com/repos/"+cfg.owner+"/"+cfg.repo+"/contents/"+cfg.path+"?ref="+cfg.branch;
  var res=await fetch(url,{headers:{Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json"}});
  if(!res.ok){ var e=await res.json().catch(function(){return {};}); throw new Error(e.message||"GitHub "+res.status); }
  var data=await res.json();
  return { store:JSON.parse(atob(data.content.replace(/\n/g,""))), sha:data.sha };
}
async function ghPut(cfg,store,sha){
  var url="https://api.github.com/repos/"+cfg.owner+"/"+cfg.repo+"/contents/"+cfg.path;
  var body={
    message:"Update data.json "+new Date().toISOString(),
    content:btoa(unescape(encodeURIComponent(JSON.stringify(store,null,2)))),
    branch:cfg.branch
  };
  if(sha) body.sha=sha;
  var res=await fetch(url,{method:"PUT",headers:{Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!res.ok){ var e=await res.json().catch(function(){return {};}); throw new Error(e.message||"GitHub "+res.status); }
  return res.json();
}

/* ════════════════════════════════════════
   CONSTANTS & HELPERS
═════════════════════════════════════════ */
var LEVELS  = ["L1","L2","L3","L4","L5"];
var LABELS  = {L1:"Level 1",L2:"Level 2",L3:"Level 3",L4:"Level 4",L5:"Level 5"};
/* which level is the "parent selector" for each level in the builder */
var PARENT_OF = {L1:null, L2:"L1", L3:"L1", L4:"L3", L5:"L4"};

function norm(s){ return (s||"").toLowerCase().trim(); }

/*
  Each item CAN have a "parent" object, e.g. {L1:"101"}.
  matchParents returns true if the item's parent constraints all match sel.
*/
function matchParents(item, sel){
  if(!item.parent) return true;
  var keys=Object.keys(item.parent);
  for(var i=0;i<keys.length;i++){
    var k=keys[i], v=item.parent[k];
    if(v && sel[k]!==v) return false;
  }
  return true;
}

function applyRules(rules, sel){
  var active=(rules||[]).filter(function(r){
    if(!r.enabled) return false;
    var when=r.when||{}, keys=Object.keys(when);
    for(var i=0;i<keys.length;i++){
      var list=when[keys[i]];
      if(list&&list.length&&list.indexOf(sel[keys[i]]||"")<0) return false;
    }
    return true;
  }).sort(function(a,b){ return (b.priority||0)-(a.priority||0); });
  var dis={}, notes=[];
  active.forEach(function(r){
    if(r.effect&&r.effect.disable) r.effect.disable.forEach(function(l){ dis[l]=true; });
    if(r.effect&&r.effect.note) notes.push(r.effect.note);
  });
  return {active:active,disabled:dis,notes:notes};
}

function emptyStore(){
  return {
    version:1,
    publishedAt:new Date().toISOString(),
    levels:{L1:[],L2:[],L3:[],L4:[],L5:[]},
    /* links: { "L2": { "parentCode": ["childCode","childCode",...] } } */
    links:{L2:{},L3:{},L4:{},L5:{}},
    rules:[]
  };
}

/* ════════════════════════════════════════
   UI PRIMITIVES
═════════════════════════════════════════ */
function Section(props){
  return (
    <div className="rounded-2xl p-4 md:p-5 bg-white/5 border border-white/10">
      <div className="flex items-center justify-between gap-2 mb-3">
        <h2 className="text-base font-semibold">{props.title}</h2>
        {props.right}
      </div>
      {props.children}
    </div>
  );
}

function Btn(props){
  var base="inline-flex items-center justify-center rounded-xl font-medium transition-all text-sm px-3 py-1.5 disabled:opacity-40 disabled:cursor-not-allowed gap-1 ";
  var styles={
    default:"border border-white/20 hover:bg-white/10",
    primary:"bg-indigo-600 hover:bg-indigo-500 text-white",
    danger:"bg-red-700 hover:bg-red-600 text-white",
    success:"bg-green-700 hover:bg-green-600 text-white",
    ghost:"hover:bg-white/10"
  };
  var v=props.variant||"default";
  return <button onClick={props.onClick} disabled={props.disabled} className={base+(styles[v]||styles.default)+" "+(props.cls||"")}>{props.children}</button>;
}

function Tag(props){
  var colors={
    default:"border-white/20 text-white/70",
    green:"border-green-600/40 text-green-300 bg-green-900/20",
    red:"border-red-600/40 text-red-300 bg-red-900/20",
    blue:"border-blue-600/40 text-blue-300 bg-blue-900/20",
    yellow:"border-yellow-600/40 text-yellow-300 bg-yellow-900/20",
    purple:"border-purple-600/40 text-purple-300 bg-purple-900/20"
  };
  var c=colors[props.color||"default"]||colors.default;
  return <span className={"inline-flex items-center px-2 py-0.5 text-xs rounded-full border "+c}>{props.children}</span>;
}

function Checkbox(props){
  return (
    <label className="flex items-center gap-2 cursor-pointer select-none">
      <div onClick={props.onChange}
           className={"w-4 h-4 rounded border flex items-center justify-center transition-colors "+(props.checked?"bg-indigo-600 border-indigo-500":"border-white/30 hover:border-white/60")}>
        {props.checked && <svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}
      </div>
      {props.label && <span className="text-sm text-white/80">{props.label}</span>}
    </label>
  );
}

/* ════════════════════════════════════════
   SEARCH SELECT (Builder)
═════════════════════════════════════════ */
function SearchSelect(props){
  var disabled=props.disabled, value=props.value, onChange=props.onChange, options=props.options||[];
  var qs=useState(""); var query=qs[0],setQuery=qs[1];
  var filtered=useMemo(function(){
    var q=norm(query);
    if(!q) return options;
    return options.filter(function(o){ return norm(o.code+" "+o.name).indexOf(q)>=0; });
  },[query,options]);
  return (
    <div className="space-y-1">
      <input disabled={disabled}
        className={"w-full rounded-xl border px-3 py-2 text-sm bg-black/30 border-white/15 outline-none focus:ring focus:ring-indigo-500/40 "+(disabled?"opacity-40 cursor-not-allowed":"")}
        placeholder={disabled?"Disabled":"Search…"}
        value={query} onChange={function(e){setQuery(e.target.value);}} />
      <div className={"max-h-48 overflow-auto scrollbar-thin rounded-xl border bg-zinc-900 border-white/10 "+(disabled?"opacity-40 pointer-events-none":"")}>
        {filtered.length===0 && <div className="p-3 text-sm text-white/40 text-center">No options</div>}
        {filtered.map(function(o){
          return (
            <button key={o.code+"|"+o.name}
              className={"w-full text-left px-3 py-2 text-sm hover:bg-white/10 border-b border-white/5 last:border-0 "+(value===o.code?"bg-indigo-500/20 text-indigo-200":"")}
              onClick={function(){onChange(o.code);}}>
              <span className="font-mono font-semibold text-xs mr-2">{o.code}</span>
              <span className="text-xs text-white/60">{o.name}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════
   PASSWORD GATE
═════════════════════════════════════════ */
function PasswordGate(props){
  var s=useState(""); var input=s[0],setInput=s[1];
  var e=useState(""); var err=e[0],setErr=e[1];
  function check(){ if(input==="05012023") props.onSuccess(); else setErr("Wrong password"); }
  return (
    <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
      <div className="bg-zinc-900 p-6 rounded-2xl border border-white/10 w-full max-w-sm space-y-3">
        <h2 className="font-semibold text-lg">Admin Login</h2>
        <input type="password" className="w-full rounded-xl border px-3 py-2 text-sm bg-black/30 border-white/15 outline-none"
               placeholder="Password" value={input}
               onChange={function(e){setInput(e.target.value);}}
               onKeyDown={function(e){if(e.key==="Enter")check();}} />
        {err && <div className="text-red-400 text-sm">{err}</div>}
        <Btn variant="primary" onClick={check} cls="w-full justify-center">Login</Btn>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════
   GITHUB SETTINGS
═════════════════════════════════════════ */
function GhSettings(props){
  var s=useState(props.cfg); var local=s[0],setLocal=s[1];
  function set(k,v){ setLocal(function(p){ var n=Object.assign({},p); n[k]=v; return n; }); }
  var fields=[
    {k:"owner",label:"GitHub Username",ph:"myusername"},
    {k:"repo", label:"Repository",     ph:"cost-center-codes"},
    {k:"branch",label:"Branch",        ph:"main"},
    {k:"path", label:"File path",      ph:"data.json"},
  ];
  return (
    <Section title="GitHub Settings" right={<Tag color="blue">Database</Tag>}>
      <div className="grid md:grid-cols-2 gap-3 mb-3">
        {fields.map(function(f){
          return (
            <div key={f.k} className="space-y-1">
              <label className="text-xs text-white/50">{f.label}</label>
              <input className="w-full rounded-xl border px-3 py-2 text-sm bg-black/30 border-white/15 outline-none"
                     placeholder={f.ph} value={local[f.k]} onChange={function(e){set(f.k,e.target.value);}} />
            </div>
          );
        })}
        <div className="md:col-span-2 space-y-1">
          <label className="text-xs text-white/50">Personal Access Token <span className="text-white/30">(Contents: read+write)</span></label>
          <input type="password" className="w-full rounded-xl border px-3 py-2 text-sm bg-black/30 border-white/15 outline-none"
                 placeholder="ghp_xxxx" value={local.token} onChange={function(e){set("token",e.target.value);}} />
        </div>
      </div>
      <Btn variant="primary" onClick={function(){ props.onChange(local); alert("Saved!"); }}>Save Settings</Btn>
    </Section>
  );
}

/* ════════════════════════════════════════
   ITEM MODAL (Add / Edit item)
═════════════════════════════════════════ */
function ItemModal(props){
  var level=props.level, item=props.item, store=props.store;
  var parentLvl=PARENT_OF[level];
  var s1=useState(item?item.code:""); var code=s1[0],setCode=s1[1];
  var s2=useState(item?item.name:""); var name=s2[0],setName=s2[1];
  var s3=useState(item&&item.parent?item.parent:{}); var parent=s3[0],setParent=s3[1];
  var s4=useState(""); var err=s4[0],setErr=s4[1];
  var parentOptions=parentLvl?(store.levels[parentLvl]||[]):[];

  function submit(){
    if(!code.trim()){setErr("Code is required.");return;}
    if(!name.trim()){setErr("Name is required.");return;}
    if(parentLvl&&!parent[parentLvl]){setErr("Select parent "+parentLvl+".");return;}
    var entry={code:code.trim(),name:name.trim()};
    if(parentLvl){var p={}; p[parentLvl]=parent[parentLvl]; entry.parent=p;}
    props.onSave(entry);
  }
  return (
    <div className="fixed inset-0 bg-black/75 flex items-center justify-center z-50 p-4">
      <div className="bg-zinc-900 rounded-2xl border border-white/10 shadow-2xl w-full max-w-md p-6 space-y-4">
        <div className="flex items-center justify-between">
          <h3 className="font-semibold">{item?"Edit":"Add"} {LABELS[level]}</h3>
          <Btn variant="ghost" onClick={props.onClose}>✕</Btn>
        </div>
        {parentLvl && (
          <div className="space-y-1">
            <label className="text-xs text-white/50">Parent {parentLvl}</label>
            <select className="w-full rounded-xl border px-3 py-2 text-sm bg-zinc-800 border-white/15 outline-none"
                    value={parent[parentLvl]||""}
                    onChange={function(e){ var p={}; p[parentLvl]=e.target.value; setParent(p); }}>
              <option value="">— Select —</option>
              {parentOptions.map(function(o){
                return <option key={o.code} value={o.code}>{o.code} — {o.name}</option>;
              })}
            </select>
          </div>
        )}
        <div className="space-y-1">
          <label className="text-xs text-white/50">Code</label>
          <input className="w-full rounded-xl border px-3 py-2 text-sm bg-black/30 border-white/15 outline-none"
                 value={code} onChange={function(e){setCode(e.target.value);}} placeholder="e.g. 2099"/>
        </div>
        <div className="space-y-1">
          <label className="text-xs text-white/50">Name</label>
          <textarea className="w-full rounded-xl border px-3 py-2 text-sm bg-black/30 border-white/15 outline-none resize-none"
                    rows="3" value={name} onChange={function(e){setName(e.target.value);}} placeholder="Description…"/>
        </div>
        {err&&<div className="text-red-400 text-sm">{err}</div>}
        <div className="flex gap-2">
          <Btn variant="primary" onClick={submit} cls="flex-1 justify-center">{item?"Save":"Add"}</Btn>
          <Btn variant="default" onClick={props.onClose}>Cancel</Btn>
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════
   LINK MANAGER
   يتحكم في أي عناصر تظهر في القائمة بناءً على اختيار القائمة الأب
═════════════════════════════════════════ */
function LinkManager(props){
  var store=props.store, onStoreChange=props.onStoreChange;

  /* الـ level الذي يتم إدارة روابطه */
  var ls=useState("L2"); var childLvl=ls[0],setChildLvl=ls[1];
  /* الـ parent المحدد */
  var ps=useState(""); var selParent=ps[0],setSelParent=ps[1];
  /* بحث في قائمة الأطفال */
  var ss=useState(""); var search=ss[0],setSearch=ss[1];

  var parentLvl=PARENT_OF[childLvl]; /* L2→L1, L3→L1, L4→L3, L5→L4 */
  var parentItems=parentLvl?(store.levels[parentLvl]||[]):[];
  var childItems=store.levels[childLvl]||[];

  /* الروابط الحالية للـ level المختار */
  var links=store.links||{};
  var lvlLinks=links[childLvl]||{};

  /* العناصر المرتبطة بالأب المختار */
  var linkedSet=selParent&&lvlLinks[selParent]?lvlLinks[selParent]:[];

  /* عناصر الأطفال بعد فلترة البحث */
  var filteredChildren=useMemo(function(){
    var q=norm(search);
    if(!q) return childItems;
    return childItems.filter(function(c){ return norm(c.code+" "+c.name).indexOf(q)>=0; });
  },[childItems,search]);

  function isLinked(childCode){
    if(!selParent) return false;
    if(!lvlLinks[selParent]||lvlLinks[selParent].length===0) return true; /* إذا فارغة = الكل مرتبط */
    return lvlLinks[selParent].indexOf(childCode)>=0;
  }

  function toggleLink(childCode){
    if(!selParent) return;
    var newLinks=JSON.parse(JSON.stringify(links));
    if(!newLinks[childLvl]) newLinks[childLvl]={};
    var current=newLinks[childLvl][selParent]||[];

    /* إذا كانت القائمة فارغة يعني "الكل مرتبط"، نبدأ بتحديد الكل ثم نشيل */
    if(current.length===0){
      current=childItems.map(function(c){return c.code;});
    }

    var idx=current.indexOf(childCode);
    if(idx>=0) current=current.filter(function(x){return x!==childCode;});
    else current=current.concat([childCode]);

    newLinks[childLvl][selParent]=current;
    var ns=Object.assign({},store,{links:newLinks});
    onStoreChange(ns);
  }

  function selectAll(){
    if(!selParent) return;
    var newLinks=JSON.parse(JSON.stringify(links));
    if(!newLinks[childLvl]) newLinks[childLvl]={};
    newLinks[childLvl][selParent]=[];  /* فارغة = الكل */
    var ns=Object.assign({},store,{links:newLinks});
    onStoreChange(ns);
  }

  function clearAll(){
    if(!selParent) return;
    var newLinks=JSON.parse(JSON.stringify(links));
    if(!newLinks[childLvl]) newLinks[childLvl]={};
    newLinks[childLvl][selParent]=["__none__"]; /* قائمة وهمية = لا شيء */
    var ns=Object.assign({},store,{links:newLinks});
    onStoreChange(ns);
  }

  var tabs=["L2","L3","L4","L5"];
  var linkedCount=selParent
    ? (lvlLinks[selParent]&&lvlLinks[selParent].length>0
        ? (lvlLinks[selParent][0]==="__none__"?0:lvlLinks[selParent].length)
        : childItems.length)
    : 0;

  return (
    <div className="space-y-4">
      <p className="text-sm text-white/50">اختر المستوى ثم اختر عنصر من القائمة الأم لتحديد أي عناصر تظهر تحته في Builder.</p>

      {/* Level tabs */}
      <div className="flex gap-2 flex-wrap">
        {tabs.map(function(lvl){
          return (
            <button key={lvl}
              onClick={function(){ setChildLvl(lvl); setSelParent(""); setSearch(""); }}
              className={"px-4 py-1.5 rounded-xl text-sm font-medium transition-all border "+(childLvl===lvl?"bg-indigo-600 border-indigo-500 text-white":"border-white/20 hover:bg-white/10")}>
              {LABELS[lvl]}
            </button>
          );
        })}
      </div>

      <div className="grid md:grid-cols-2 gap-4">
        {/* Parent list */}
        <div className="rounded-xl border border-white/10 bg-black/20 overflow-hidden">
          <div className="px-3 py-2 bg-white/5 border-b border-white/10 text-xs font-semibold text-white/60 uppercase tracking-wider">
            {parentLvl?LABELS[parentLvl]+" (الأب)":"—"}
          </div>
          <div className="max-h-80 overflow-auto scrollbar-thin divide-y divide-white/5">
            {parentItems.length===0 && <div className="p-4 text-sm text-white/40 text-center">لا توجد بيانات</div>}
            {parentItems.map(function(p){
              var hasCustom=lvlLinks[p.code]&&lvlLinks[p.code].length>0;
              var count=hasCustom
                ? (lvlLinks[p.code][0]==="__none__"?0:lvlLinks[p.code].length)
                : childItems.length;
              return (
                <button key={p.code}
                  onClick={function(){setSelParent(p.code); setSearch("");}}
                  className={"w-full text-left px-3 py-2.5 hover:bg-white/5 transition-colors "+(selParent===p.code?"bg-indigo-500/15 border-l-2 border-indigo-400":"border-l-2 border-transparent")}>
                  <div className="flex items-center justify-between gap-2">
                    <div>
                      <span className="font-mono text-xs font-semibold">{p.code}</span>
                      <span className="text-xs text-white/50 ml-2">{p.name}</span>
                    </div>
                    <Tag color={hasCustom?"purple":"default"}>
                      {count} {LABELS[childLvl]}
                    </Tag>
                  </div>
                </button>
              );
            })}
          </div>
        </div>

        {/* Child checkboxes */}
        <div className="rounded-xl border border-white/10 bg-black/20 overflow-hidden">
          <div className="px-3 py-2 bg-white/5 border-b border-white/10 flex items-center justify-between gap-2">
            <span className="text-xs font-semibold text-white/60 uppercase tracking-wider">
              {LABELS[childLvl]} المتاحة
              {selParent && <span className="text-indigo-300 ml-2">({linkedCount} محدد)</span>}
            </span>
            {selParent && (
              <div className="flex gap-1">
                <Btn variant="ghost" onClick={selectAll} cls="text-xs py-0.5 px-2">الكل</Btn>
                <Btn variant="ghost" onClick={clearAll} cls="text-xs py-0.5 px-2 text-red-400">لا شيء</Btn>
              </div>
            )}
          </div>
          {!selParent && (
            <div className="p-6 text-center text-sm text-white/40">
              اختر عنصراً من القائمة اليسار أولاً
            </div>
          )}
          {selParent && (
            <div className="p-2 border-b border-white/10">
              <input className="w-full rounded-xl border px-3 py-1.5 text-sm bg-black/30 border-white/15 outline-none"
                     placeholder="بحث…" value={search} onChange={function(e){setSearch(e.target.value);}} />
            </div>
          )}
          {selParent && (
            <div className="max-h-72 overflow-auto scrollbar-thin divide-y divide-white/5 p-1">
              {filteredChildren.length===0 && <div className="p-4 text-sm text-white/40 text-center">لا توجد عناصر</div>}
              {filteredChildren.map(function(c){
                var linked=isLinked(c.code);
                return (
                  <div key={c.code}
                    onClick={function(){toggleLink(c.code);}}
                    className={"flex items-center gap-3 px-2 py-2 rounded-xl cursor-pointer transition-colors hover:bg-white/5 "+(linked?"bg-indigo-500/10":"")}>
                    <Checkbox checked={linked} onChange={function(){toggleLink(c.code);}}/>
                    <div className="flex-1 min-w-0">
                      <span className="font-mono text-xs font-semibold">{c.code}</span>
                      <span className="text-xs text-white/50 ml-2 truncate">{c.name}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>

      <div className="rounded-xl border border-indigo-500/20 bg-indigo-900/10 p-3 text-sm text-indigo-300/80">
        <strong>ملاحظة:</strong> عندما لا تحدد أي روابط للأب، تظهر جميع عناصر المستوى التالي. عند التحديد، تظهر فقط العناصر المختارة.
      </div>
    </div>
  );
}

/* ════════════════════════════════════════
   LEVEL EDITOR
═════════════════════════════════════════ */
function LevelEditor(props){
  var level=props.level, store=props.store;
  var parentLvl=PARENT_OF[level];
  var ms=useState(null); var modal=ms[0],setModal=ms[1];
  var ss=useState(""); var search=ss[0],setSearch=ss[1];
  var fps=useState(""); var fp=fps[0],setFp=fps[1];

  var items=store.levels[level]||[];
  var parentOptions=parentLvl?(store.levels[parentLvl]||[]):[];

  var filtered=useMemo(function(){
    var arr=items;
    if(fp&&parentLvl) arr=arr.filter(function(i){ return i.parent&&i.parent[parentLvl]===fp; });
    if(search){ var q=norm(search); arr=arr.filter(function(i){ return norm(i.code+" "+i.name).indexOf(q)>=0; }); }
    return arr;
  },[items,search,fp,parentLvl]);

  function saveItem(entry){
    var nl=Object.assign({},store.levels);
    var arr=(nl[level]||[]).slice();
    if(modal&&modal.item){
      var orig=modal.item;
      var idx=arr.findIndex(function(x){ return x.code===orig.code&&JSON.stringify(x.parent)===JSON.stringify(orig.parent); });
      if(idx>=0) arr[idx]=entry; else arr.push(entry);
    } else { arr.push(entry); }
    nl[level]=arr;
    props.onStoreChange(Object.assign({},store,{levels:nl}));
    setModal(null);
  }

  function deleteItem(item){
    if(!confirm("Delete \""+item.code+" — "+item.name+"\"?")) return;
    var nl=Object.assign({},store.levels);
    nl[level]=(nl[level]||[]).filter(function(x){
      return !(x.code===item.code&&JSON.stringify(x.parent)===JSON.stringify(item.parent));
    });
    props.onStoreChange(Object.assign({},store,{levels:nl}));
  }

  return (
    <div className="rounded-xl border border-white/10 bg-black/20 overflow-hidden">
      <div className="px-4 py-3 bg-white/5 border-b border-white/10 flex items-center justify-between gap-2">
        <div className="font-semibold text-sm">{LABELS[level]} <span className="text-white/40 font-normal text-xs">({filtered.length}/{items.length})</span></div>
        <Btn variant="primary" onClick={function(){setModal({item:null});}}>+ Add</Btn>
      </div>
      <div className="p-3 border-b border-white/10 flex gap-2 flex-wrap">
        <input className="flex-1 min-w-0 rounded-xl border px-3 py-1.5 text-sm bg-black/30 border-white/15 outline-none"
               placeholder="Search…" value={search} onChange={function(e){setSearch(e.target.value);}} />
        {parentLvl && (
          <select className="rounded-xl border px-2 py-1.5 text-sm bg-zinc-800 border-white/15 outline-none"
                  value={fp} onChange={function(e){setFp(e.target.value);}}>
            <option value="">All {parentLvl}</option>
            {parentOptions.map(function(o){ return <option key={o.code} value={o.code}>{o.code} — {o.name.slice(0,25)}</option>; })}
          </select>
        )}
      </div>
      <div className="max-h-64 overflow-auto scrollbar-thin divide-y divide-white/5">
        {filtered.length===0 && <div className="p-4 text-sm text-white/40 text-center">No items.</div>}
        {filtered.map(function(item,i){
          return (
            <div key={item.code+i} className="flex items-start gap-2 px-4 py-2.5 hover:bg-white/5 group">
              <div className="flex-1 min-w-0">
                <span className="font-mono text-xs font-semibold">{item.code}</span>
                <span className="text-xs text-white/50 ml-2">{item.name}</span>
                {item.parent && (
                  <div className="text-xs text-indigo-400/50 mt-0.5">
                    {Object.keys(item.parent).map(function(k){return k+":"+item.parent[k];}).join(", ")}
                  </div>
                )}
              </div>
              <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity shrink-0">
                <Btn variant="default" onClick={function(){setModal({item:item});}}>✎</Btn>
                <Btn variant="danger" onClick={function(){deleteItem(item);}}>✕</Btn>
              </div>
            </div>
          );
        })}
      </div>
      {modal && (
        <ItemModal level={level} item={modal.item} store={store} onSave={saveItem} onClose={function(){setModal(null);}} />
      )}
    </div>
  );
}

/* ════════════════════════════════════════
   VALIDATOR
═════════════════════════════════════════ */
function Validator(props){
  var s1=useState(""); var input=s1[0],setInput=s1[1];
  var s2=useState(null); var res=s2[0],setRes=s2[1];
  return (
    <div className="space-y-3">
      <div className="flex gap-2">
        <input className="flex-1 rounded-xl border px-3 py-2 text-sm bg-black/30 border-white/15 outline-none"
               placeholder="101-2001-32-420-5001 (use xx for empty)" value={input}
               onChange={function(e){setInput(e.target.value);}} />
        <Btn variant="default" onClick={function(){setRes(props.onValidate(input));}}>Validate</Btn>
      </div>
      {res&&res.details&&(
        <div className="space-y-2">
          {res.details.map(function(d){
            return (
              <div key={d.level} className={"rounded-xl p-3 border "+(d.valid?"bg-green-900/30 text-green-200 border-green-700/40":"bg-red-900/30 text-red-200 border-red-700/40")}>
                <div className="font-semibold text-sm">L{LEVELS.indexOf(d.level)+1}: {d.code}</div>
                {d.name&&<div className="text-xs opacity-80">{d.name}</div>}
                {!d.valid&&d.message&&<div className="text-xs mt-1">{d.message}</div>}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ════════════════════════════════════════
   MAIN APP
═════════════════════════════════════════ */
function App(){
  var s1=useState(null);  var store=s1[0],setStore=s1[1];
  var s2=useState(null);  var sha=s2[0],setSha=s2[1];
  var s3=useState(loadGhCfg); var ghCfg=s3[0],setGhCfg=s3[1];
  var s4=useState("builder"); var tab=s4[0],setTab=s4[1];
  var s5=useState("items"); var adminTab=s5[0],setAdminTab=s5[1];
  var s6=useState(false); var unlocked=s6[0],setUnlocked=s6[1];
  var s7=useState({t:"",m:""}); var status=s7[0],setStatus=s7[1];
  var s8=useState(true);  var loading=s8[0],setLoading=s8[1];
  var s9=useState(false); var saving=s9[0],setSaving=s9[1];
  var s10=useState(false); var dirty=s10[0],setDirty=s10[1];
  var s11=useState({L1:"",L2:"",L3:"",L4:"",L5:""}); var sel=s11[0],setSel=s11[1];

  var isGhOk=!!(ghCfg.owner&&ghCfg.repo&&ghCfg.token);

  useEffect(function(){
    async function load(){
      setLoading(true);
      if(isGhOk){
        try{
          var r=await ghGet(ghCfg);
          /* ensure links field exists */
          if(!r.store.links) r.store.links={L2:{},L3:{},L4:{},L5:{}};
          setStore(r.store); setSha(r.sha); saveCache(r.store);
          setStatus({t:"green",m:"Loaded from GitHub ✓"});
        }catch(e){
          var c=loadCache();
          if(c){ setStore(c); setStatus({t:"yellow",m:"Offline cache ("+e.message+")"}); }
          else{ setStore(emptyStore()); setStatus({t:"red",m:"GitHub error: "+e.message}); }
        }
      } else {
        var c=loadCache();
        if(c){ if(!c.links) c.links={L2:{},L3:{},L4:{},L5:{}}; setStore(c); setStatus({t:"yellow",m:"Cached data loaded."}); }
        else{ setStore(emptyStore()); setStatus({t:"yellow",m:"No data. Configure GitHub in Admin."}); }
      }
      setLoading(false);
    }
    load();
  },[]);

  function updateStore(ns){
    if(!ns.links) ns.links={L2:{},L3:{},L4:{},L5:{}};
    setStore(ns); saveCache(ns); setDirty(true);
  }

  async function saveToGh(){
    if(!isGhOk){alert("Configure GitHub first.");return;}
    setSaving(true);
    try{
      var updated=Object.assign({},store,{publishedAt:new Date().toISOString()});
      var r=await ghPut(ghCfg,updated,sha);
      setSha(r.content.sha); setStore(updated); saveCache(updated); setDirty(false);
      setStatus({t:"green",m:"Saved ✓ "+new Date().toLocaleTimeString()});
    }catch(e){
      setStatus({t:"red",m:"Save failed: "+e.message});
      alert("Save failed: "+e.message);
    }
    setSaving(false);
  }

  async function refreshFromGh(){
    if(!isGhOk){alert("Configure GitHub first.");return;}
    setLoading(true);
    try{
      var r=await ghGet(ghCfg);
      if(!r.store.links) r.store.links={L2:{},L3:{},L4:{},L5:{}};
      setStore(r.store); setSha(r.sha); saveCache(r.store); setDirty(false);
      setStatus({t:"green",m:"Refreshed ✓"});
    }catch(e){
      setStatus({t:"red",m:"Refresh failed: "+e.message});
    }
    setLoading(false);
  }

  /* ── Builder: compute visible options using links ── */
  var ruleResult=useMemo(function(){
    return store?applyRules(store.rules||[],sel):{active:[],disabled:{},notes:[]};
  },[store,sel]);
  var dis=ruleResult.disabled, ruleNotes=ruleResult.notes;

  var options=useMemo(function(){
    if(!store) return {};
    var links=store.links||{};
    var out={};
    LEVELS.forEach(function(lvl){
      var parentLvl=PARENT_OF[lvl];
      var all=store.levels[lvl]||[];

      if(!parentLvl){
        /* L1: no parent filtering */
        out[lvl]=all;
        return;
      }

      var parentCode=sel[parentLvl]||"";

      /* First filter by item.parent field (existing logic) */
      var arr=all.filter(function(it){ return matchParents(it,sel); });

      /* Then filter by links if a parent is selected and links exist */
      if(parentCode){
        var lvlLinks=links[lvl]||{};
        var allowed=lvlLinks[parentCode];
        if(allowed!==undefined&&allowed!==null){
          if(allowed.length===0){
            /* empty = show all */
          } else if(allowed[0]==="__none__"){
            arr=[];
          } else {
            arr=arr.filter(function(it){ return allowed.indexOf(it.code)>=0; });
          }
        }
      }

      out[lvl]=arr;
    });
    return out;
  },[store,sel]);

  function updateLevel(lvl,val){
    setSel(function(prev){
      var idx=LEVELS.indexOf(lvl);
      var next=Object.assign({},prev);
      next[lvl]=val;
      for(var i=idx+1;i<LEVELS.length;i++) next[LEVELS[i]]="";
      return next;
    });
  }

  var code=LEVELS.map(function(l){return sel[l]||"xx";}).join("-");

  function validateCode(codeStr){
    if(!store) return {ok:false,details:[]};
    var parts=(codeStr||"").trim().split(/[-\s]+/);
    if(parts.length!==5) return {ok:false,details:LEVELS.map(function(lvl,i){return {level:lvl,code:(parts[i]||"").toUpperCase(),name:"",valid:false,message:"Need 5 parts."}; })};
    var normP=function(p){return /^x{2}$/i.test(p)?"":p;};
    var vals=parts.map(normP);
    var s={L1:vals[0],L2:vals[1],L3:vals[2],L4:vals[3],L5:vals[4]};
    var det=[];
    LEVELS.forEach(function(lvl){
      var provided=s[lvl]||"";
      var opts=(store.levels[lvl]||[]).filter(function(it){return matchParents(it,s);});
      var found=(store.levels[lvl]||[]).find(function(x){return x.code===provided;});
      var valid=provided===""||!!opts.find(function(o){return o.code===provided;});
      det.push({level:lvl,code:(provided||"xx").toUpperCase(),name:found?found.name:"",valid:valid,message:valid?"":"Invalid code for its parent."});
    });
    return {ok:det.every(function(d){return d.valid;}),details:det};
  }

  var statColors={green:"bg-green-900/30 border-green-700/40 text-green-300",red:"bg-red-900/30 border-red-500/40 text-red-300",yellow:"bg-yellow-900/30 border-yellow-700/40 text-yellow-300"};

  if(loading){
    return (
      <div className="min-h-screen bg-gradient-to-b from-zinc-950 to-black flex items-center justify-center">
        <div className="text-white/50 text-lg animate-pulse">Loading…</div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-gradient-to-b from-zinc-950 to-black p-4 md:p-8">
      <div className="max-w-7xl mx-auto space-y-5">

        {/* Header */}
        <header className="flex flex-wrap items-center justify-between gap-3">
          <h1 className="text-xl md:text-2xl font-bold tracking-tight">Cost Center Code Manager</h1>
          <div className="flex items-center gap-2 flex-wrap">
            {dirty&&<Tag color="red">Unsaved</Tag>}
            {isGhOk&&<Tag color="blue">{ghCfg.owner}/{ghCfg.repo}</Tag>}
            <Btn variant={tab==="builder"?"primary":"default"} onClick={function(){setTab("builder");}}>🔨 Builder</Btn>
            <Btn variant={tab==="admin"?"primary":"default"} onClick={function(){setTab("admin");}}>⚙ Admin</Btn>
          </div>
        </header>

        {/* Status bar */}
        {status.m&&(
          <div className={"rounded-xl border px-4 py-2 text-sm flex items-center justify-between gap-2 "+(statColors[status.t]||statColors.yellow)}>
            <span>{status.m}</span>
            <button onClick={function(){setStatus({t:"",m:""});}} className="opacity-50 hover:opacity-100">✕</button>
          </div>
        )}

        {/* ── BUILDER TAB ── */}
        {tab==="builder"&&(
          <div className="space-y-4">
            <div className="grid md:grid-cols-5 gap-3">
              {LEVELS.map(function(lvl){
                var opts=options[lvl]||[];
                var parentLvl=PARENT_OF[lvl];
                var parentSelected=!parentLvl||!!sel[parentLvl];
                return (
                  <div key={lvl} className="rounded-2xl p-3 bg-white/5 border border-white/10 space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="text-sm font-semibold">{LABELS[lvl]}</span>
                      <div className="flex items-center gap-1">
                        {dis[lvl]&&<Tag>Disabled</Tag>}
                        {sel[lvl]&&(
                          <button onClick={function(){updateLevel(lvl,"");}} className="text-white/30 hover:text-white/70 text-xs ml-1">✕</button>
                        )}
                      </div>
                    </div>
                    {!parentSelected&&!dis[lvl]&&(
                      <div className="text-xs text-white/30 py-4 text-center">Select {LABELS[parentLvl]} first</div>
                    )}
                    {(parentSelected||lvl==="L1")&&!dis[lvl]&&(
                      <SearchSelect
                        disabled={false}
                        value={sel[lvl]}
                        onChange={function(v){updateLevel(lvl,v);}}
                        options={opts}
                      />
                    )}
                    {dis[lvl]&&<div className="text-xs text-white/30 py-4 text-center">Disabled by rules</div>}
                    {sel[lvl]&&(
                      <div className="text-center">
                        <span className="inline-block bg-indigo-600/30 border border-indigo-500/30 text-indigo-300 text-xs font-mono px-2 py-0.5 rounded-lg">{sel[lvl]}</span>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            {/* Live code */}
            <Section title="Live Code">
              <div className="flex flex-wrap items-center gap-3">
                <span className="text-2xl font-mono tracking-widest bg-black/30 px-4 py-2 rounded-xl border border-white/10">{code}</span>
                <Btn variant="primary" onClick={function(){navigator.clipboard.writeText(code).then(function(){alert("Copied!");}).catch(function(){});}}>Copy</Btn>
                <Btn variant="default" onClick={function(){setSel({L1:"",L2:"",L3:"",L4:"",L5:""});}}>Reset</Btn>
              </div>
              {ruleNotes.length>0&&(
                <ul className="mt-3 list-disc list-inside text-sm text-white/60 space-y-1">
                  {ruleNotes.map(function(n,i){return <li key={i}>{n}</li>;})}
                </ul>
              )}
            </Section>

            <Section title="Validate Code">
              <Validator onValidate={validateCode}/>
            </Section>
          </div>
        )}

        {/* ── ADMIN TAB ── */}
        {tab==="admin"&&(
          unlocked?(
            <div className="space-y-5">

              {/* Sync bar */}
              <Section title="Sync" right={dirty?<Tag color="red">Unsaved changes</Tag>:<Tag color="green">Up to date</Tag>}>
                <div className="flex flex-wrap gap-2">
                  <Btn variant="success" disabled={saving||!dirty} onClick={saveToGh}>{saving?"Saving…":"💾 Save to GitHub"}</Btn>
                  <Btn variant="default" disabled={saving} onClick={refreshFromGh}>↻ Refresh</Btn>
                  <Btn variant="default" onClick={function(){
                    var a=document.createElement("a");
                    a.href=URL.createObjectURL(new Blob([JSON.stringify(store,null,2)],{type:"application/json"}));
                    a.download="data_"+new Date().toISOString().slice(0,10)+".json";
                    a.click();
                  }}>⬇ Export</Btn>
                  <label className="inline-flex items-center px-3 py-1.5 text-sm rounded-xl border border-white/20 hover:bg-white/10 cursor-pointer">
                    ⬆ Import
                    <input type="file" className="hidden" accept="application/json" onChange={function(e){
                      var f=e.target.files&&e.target.files[0]; if(!f) return;
                      var r=new FileReader();
                      r.onload=function(){
                        try{
                          var j=JSON.parse(r.result);
                          if(!j.levels||!j.levels.L1) throw new Error("Invalid schema");
                          if(!j.links) j.links={L2:{},L3:{},L4:{},L5:{}};
                          updateStore(j); alert("Imported!");
                        }catch(err){ alert("Import failed: "+err.message); }
                      };
                      r.readAsText(f);
                    }}/>
                  </label>
                </div>
                {!isGhOk&&<p className="text-yellow-400 text-sm mt-2">⚠ GitHub not configured.</p>}
              </Section>

              {/* Admin sub-tabs */}
              <div className="flex gap-2 border-b border-white/10 pb-1">
                {[{k:"items",l:"📋 Edit Items"},{k:"links",l:"🔗 Manage Links"},{k:"github",l:"⚙ GitHub"}].map(function(t){
                  return (
                    <button key={t.k}
                      onClick={function(){setAdminTab(t.k);}}
                      className={"px-4 py-2 rounded-t-xl text-sm font-medium transition-all border-b-2 "+(adminTab===t.k?"border-indigo-500 text-white bg-white/5":"border-transparent text-white/50 hover:text-white/80")}>
                      {t.l}
                    </button>
                  );
                })}
              </div>

              {/* Items editor */}
              {adminTab==="items"&&(
                <div className="space-y-4">
                  {LEVELS.map(function(lvl){
                    return <LevelEditor key={lvl} level={lvl} store={store} onStoreChange={updateStore}/>;
                  })}
                </div>
              )}

              {/* Links manager */}
              {adminTab==="links"&&(
                <Section title="🔗 إدارة الروابط بين المستويات">
                  <LinkManager store={store} onStoreChange={updateStore}/>
                </Section>
              )}

              {/* GitHub settings */}
              {adminTab==="github"&&(
                <GhSettings cfg={ghCfg} onChange={function(c){setGhCfg(c);saveGhCfg(c);}}/>
              )}
            </div>
          ):(
            <PasswordGate onSuccess={function(){setUnlocked(true);}}/>
          )
        )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
